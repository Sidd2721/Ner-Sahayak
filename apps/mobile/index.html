<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NER Sahayak Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #3b82f6;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* Header styling */
    header {
      padding: 1.5rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
    }
    
    #app-title {
      background: linear-gradient(to right, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem;
      margin: 0;
    }

    .container {
      padding: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Glassmorphism Card System */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    
    .glass-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      font-weight: 500;
      color: white;
      margin-bottom: 1.2rem;
    }

    /* Status Board Rows */
    #status-board { margin-bottom: 2rem; }
    .district-row {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }
    .status-critical { border-left: 4px solid #ef4444; }
    .status-watch { border-left: 4px solid #f97316; }
    .status-ok { border-left: 4px solid #22c55e; }

    /* Forms and Inputs */
    input, select, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      margin-bottom: 1.2rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-family: 'Outfit', sans-serif;
      box-sizing: border-box;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    input::placeholder, textarea::placeholder {
      color: #64748b;
    }
    
    select option {
      background: #1e293b;
      color: white;
    }

    /* Buttons */
    button {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled { 
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
      padding: 0;
      border: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      margin-top: -8px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    /* Badges & Utility */
    .hidden { display: none !important; }
    
    #pending-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: #f59e0b;
      color: #78350f;
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      margin-right: 0.5rem;
      box-shadow: 0 2px 4px rgba(245, 158, 11, 0.2);
    }
    
    .header-controls {
      display: flex;
      align-items: center;
    }
    
    #lang-select {
      width: auto;
      margin: 0;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="app-title">NER Sahayak</h1>
    <div class="header-controls">
      <span id="pending-badge" class="hidden">Pending Sync</span>
      <select id="lang-select">
        <option value="en">EN</option>
        <option value="hi">HI</option>
        <option value="as">AS</option>
      </select>
    </div>
  </header>

  <div id="auth-view" class="container hidden">
    <div class="glass-card">
      <h2 id="login-title">Welcome Back!</h2>
      <p style="color: var(--text-muted); margin-top: -1rem; margin-bottom: 1.5rem; font-size: 0.9rem;">Login to report incidents or view alerts</p>
      
      <input type="email" id="auth-email" placeholder="Email Address" />
      <input type="password" id="auth-pass" placeholder="Password" />
      <button id="auth-submit" style="margin-bottom: 1rem;">Login ➔</button>
      <div style="text-align: center; margin-bottom: 1rem; color: var(--text-muted); font-size: 0.85rem;">OR</div>
      <button id="auth-demo" style="background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); box-shadow: none;">Quick Login (Demo)</button>
    </div>
  </div>

  <div id="app-view" class="container hidden">
    <section class="glass-card">
      <h2 id="status-title">Live Incident Map</h2>
      <div id="map-container" style="height: 250px; width: 100%; border-radius: 12px; margin-bottom: 0.75rem; z-index: 1; border: 1px solid var(--glass-border);"></div>
      <style>
        .safe-route-btn { width: 100%; margin-bottom: 0.5rem; }
        .safe-route-btn[hidden] { display: none; }
        .safe-route-status { display: block; text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; min-height: 1.1em; }
      </style>
      <div id="status-board">
        <!-- Rendered from local Dexie -->
        <div style="padding:1rem; text-align:center; color:var(--text-muted);">Loading status...</div>
      </div>
    </section>

    <div class="glass-card" id="report-card">
      <h2 id="report-title">Submit a New Report</h2>
      
      <label>Incident Type</label>
      <select id="report-type">
        <option value="landslide">Landslide</option>
        <option value="washout">Road Washout</option>
        <option value="accident">Accident</option>
      </select>
      
      <label id="severity-label">Severity Level (1-5)</label>
      <input type="range" id="report-severity" min="1" max="5" value="3">
      <div id="risk-preview" style="margin-bottom:1.5rem; font-size:0.9rem; color:var(--text-muted); font-weight: 500;">Moderate Risk</div>
      
      <label>Details</label>
      <textarea id="report-desc" placeholder="Describe the incident..." rows="3"></textarea>
      
      <button id="report-submit">Submit Offline Report</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
